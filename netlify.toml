[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]

# Omit non-secret keys from secrets scanning
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PORT"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,README.md"

# Redirect API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# SPA fallback — serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
